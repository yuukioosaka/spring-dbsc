name: E2E (live HTTPS)

# The unit suite mocks nothing but the servlet container; this workflow drives the
# real thing. It boots the demo app over HTTPS and runs scripts/e2e.py against it
# with a deliberately tiny challenge TTL, because that is the only way to observe
# CHALLENGE_EXPIRED: at production TTLs the check is skipped, not passed.
#
# Separate from build.yml because it is slower and because a failure here means
# something different: the protocol is broken end to end, not a unit regressed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Live HTTPS end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # 17 rather than 25: the library compiles at the Java 17 release level, so
      # the E2E suite should run the demo on the oldest supported JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The suite signs ES256 proofs, so it needs a real crypto library rather
      # than hand-rolled ASN.1.
      - name: Install test dependencies
        run: python -m pip install --upgrade cryptography

      - name: Generate the demo keystore
        run: sh scripts/make-keystore.sh

      # Two instances, not one. The main demo raises its rate-limit budgets to 1000
      # so this suite's deliberate failures do not throttle the run that is testing
      # them, which leaves the 429 branch unreachable there; the second instance
      # exists only to make RATE_LIMITED observable. Both get a 2-second challenge
      # TTL, which is what makes CHALLENGE_EXPIRED reachable at test speed.
      - name: Start both demos over HTTPS
        run: sh scripts/run-demos.sh

      - name: Run the end-to-end suite
        env:
          DBSC_CHALLENGE_TTL: '2'
          DBSC_RATE_LIMIT_FAILURES: '5'
        run: python scripts/e2e.py

      # Guards against a new error code being added without a scenario that
      # reaches it, which is how RATE_LIMITED and INVALID_JWK went unexercised.
      - name: Check every error code is exercised
        run: python scripts/check-error-coverage.py

      - name: Demo log on failure
        if: failure()
        run: tail -200 /tmp/demo.log; echo '--- rate-limit demo ---'; tail -200 /tmp/demo-ratelimit.log

      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: demo-logs
          path: |
            /tmp/demo.log
            /tmp/demo-ratelimit.log
          if-no-files-found: ignore
          retention-days: 7
