# Test-facing configuration.
#
# Uses an in-memory H2 database and disables the Secure flag, so the tests can
# exercise the cookie mechanics over plain HTTP.

dbsc:
  secure: false
  storage: jdbc
  # The web tests run on the real clock and a frozen-clock test cannot cover the
  # boundary for them, so the deadline is pushed well out of the way. Anything
  # shorter would make every session these tests create already expired, and the
  # refresh route would refuse it before the protocol was reached. The boundary
  # itself is pinned in RefreshExpiryTest, which freezes the clock.
  session-ttl: 3650d
  # Deliberately different from the session cookie name, so the tests prove the
  # two names in the JSON config are independent.
  credential-cookie-name: __Host-auth_cookie
  # Soft DBSC is on by default. The re-offer route has no other way to be reached --
  # with the flag off it is not registered at all -- so this is set explicitly to
  # keep the tests independent of the default. The default itself is asserted
  # separately, in SoftDbscConfigTest.
  soft:
    enabled: true

spring:
  datasource:
    url: jdbc:h2:mem:dbsc-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

logging:
  level:
    click.yukio.dbsc: INFO
