# Test-facing configuration.
#
# Uses an in-memory H2 database and disables the Secure flag, so the tests can
# exercise the cookie mechanics over plain HTTP.

dbsc:
  secure: false
  storage: jdbc
  # Deliberately different from the session cookie name, so the tests prove the
  # two names in the JSON config are independent.
  credential-cookie-name: __Host-auth_cookie
  rate-limit:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:dbsc-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

logging:
  level:
    click.yukio.dbsc: INFO
