# Default DBSC configuration.
#
# These are the values a host application gets without configuring anything.
# Everything here can be overridden in the host's own application.yaml — DBSC is
# a library, so nothing in this file is meant to be edited; it exists so the
# defaults are visible in one place.
#
# secure: true is the safe default: __Host- cookies, Secure, and no cleartext
# binding cookie. Local development over plain HTTP must opt out explicitly
# (dbsc.secure: false) in the host's own configuration.

dbsc:
  secure: true
  # jdbc when the host has a DataSource and the state must survive a restart;
  # memory otherwise. An in-memory store breaks live sessions across a restart.
  storage: jdbc
  # The registration route is a prefix, not one fixed path: the token that names
  # the session is appended to it, giving /dbsc/regist/<token>. The token is in
  # the path (rather than in a cookie) so that registration also works when the
  # browser's registration POST is issued from a cross-site navigation context.
  registration-path: /dbsc/regist
  refresh-path: /dbsc/refresh
  # Grace window past the binding cookie's expiry: a freshness poll that lands
  # while the browser's next refresh is in flight still reads the old tier.
  binding-cookie-ttl: 10m
  # Lifetime of a registration token, and so of the registration opportunity.
  registration-cookie-ttl: 24h
  challenge-ttl: 5m
  refresh-grace: 30s
  session-ttl: 7d
  # Two budgets per client: total requests, and failed attempts. The failure
  # budget is what stops an attacker grinding challenges, since it trips long
  # before ordinary request volume would.
  rate-limit:
    enabled: true
    capacity: 30
    failure-capacity: 15
    window: 1m

logging:
  level:
    click.yukio.dbsc: DEBUG
