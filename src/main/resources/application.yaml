# Default DBSC configuration.
#
# These are the values a host application gets without configuring anything.
# Everything here can be overridden in the host's own application.yaml — DBSC is
# a library, so nothing in this file is meant to be edited; it exists so the
# defaults are visible in one place.
#
# secure: true is the safe default: __Host- cookies, Secure, and no cleartext
# binding cookie. Local development over plain HTTP must opt out explicitly
# (dbsc.secure: false) in the host's own configuration.

dbsc:
  secure: true
  # jdbc (default) when the host has a DataSource and the state must survive a restart;
  # redis for a host that already runs a Redis/Valkey-compatible server and has no
  # DataSource — it needs spring.data.redis.* configured and the optional
  # spring-data-redis dependency; memory for tests and local dev only, where every
  # restart breaks live sessions.
  storage: jdbc
  # The registration route is a prefix, not one fixed path: the token that names
  # the session is appended to it, giving /dbsc/regist/<token>. The token is in
  # the path (rather than in a cookie) so that registration also works when the
  # browser's registration POST is issued from a cross-site navigation context.
  registration-path: /dbsc/regist
  refresh-path: /dbsc/refresh
  # session_identifier (spec 9.6) is the session id itself, so there is no name to
  # configure here: the value written into the JSON config is whatever the caller passed
  # to bind(). It names no cookie -- nothing is read from or written to a cookie of that
  # name -- so the id exists only server-side and the only cookie that moves is the
  # rotating credential one below.
  # The cookie named in the JSON config's `credentials[]`, whose value is a ticket
  # reissued on every successful refresh, so a copy of it is worth one refresh
  # window rather than the session's lifetime. Retired values keep resolving for
  # rotation-grace, so a second tab that has not seen the new value does not break.
  # The name is used verbatim; a prefix is the deployer's choice.
  credential-cookie-name: __Host-auth_cookie
  # Grace window past the binding cookie's expiry: a freshness poll that lands
  # while the browser's next refresh is in flight still reads the old tier.
  binding-cookie-ttl: 10m
  # Lifetime of a registration token, and so of the registration opportunity.
  registration-cookie-ttl: 24h
  challenge-ttl: 5m
  refresh-grace: 30s
  # How long a retired ticket-cookie value keeps resolving to the id that replaced
  # it. The window is itself exposure, so set it to the longest gap between
  # refreshes that must survive, not to a round number.
  rotation-grace: 60s
  session-ttl: 7d
  # What the route guard does with a client that has no DBSC binding at all.
  # "allow" keeps DBSC an additional layer: a browser without support for the
  # protocol, and a client that has logged in but not yet registered, both reach
  # the application. A session that bound and then lapsed is refused either way.
  # "deny" makes DBSC a requirement and locks out every unsupported browser, so
  # only set it when the client population is known to be capable.
  unregistered: allow
  # Two budgets per client: total requests, and failed attempts. The failure
  # budget is what stops an attacker grinding challenges, since it trips long
  # before ordinary request volume would.
  rate-limit:
    enabled: true
    capacity: 30
    failure-capacity: 15
    window: 1m

  # Which URLs the session covers, written into the JSON config as
  # scope.scope_specification (spec 9.7, 9.8). These are instructions to the browser,
  # not server-side checks: the user agent decides where to attach the credential and
  # when to refresh from them.
  #
  # scope.origin is derived from the request, and normally needs no configuration. If
  # the derived value is wrong (a proxy rewriting the host to an internal name, a CDN
  # setting no forwarding header this library reads), pin it here. Prefer
  # trust-forwarded-headers where that applies: it stays correct if the public name
  # changes. An absolute origin, no path, scheme included:
  #
  #   scope-origin: https://example.com:8443
  #
  # A wrong value is invisible on the wire — Chromium discards the session while the
  # server answers 200 — so it is validated at startup and fails the context.
  scope-origin:
  # The browser walks this list in REVERSE and stops at the first match (8.2), so the
  # last rule written wins. The idiomatic shape is therefore outermost-first: exclude a
  # broad area, then include the part of it that matters.
  #
  # Empty means the entire origin applies (or the entire site, when cookie-scope is
  # "site"). "domain" defaults to "*" and "path" to "/" when omitted; both are written
  # out explicitly in the response so the emitted JSON says what it means.
  scope-specifications: []
  #   - type: exclude
  #     domain: "*.example.com"
  #     path: /static
  #   - type: include
  #     domain: trusted.example.com
  #     path: /only_trusted_path

  # Hosts OUTSIDE the scope above that may still trigger a refresh, written into the
  # JSON config as allowed_refresh_initiators (spec 9.6, 8.3).
  #
  # This is the remedy for the refresh endpoint's timing side channel (spec 3.2): by
  # default an out-of-scope cross-origin fetch to a protected URL blocks on the refresh
  # request, and the delay alone reveals whether the user is logged in. Listing only the
  # hosts that genuinely need to call the site removes that signal for everyone else.
  #
  # Each entry is a host or host pattern: "*" matches everything, "*.example.com" matches
  # subdomains of example.com but NOT example.com itself, and a bare host matches only
  # itself (8.4). In-scope requests are always allowed, so this list is only about
  # out-of-scope callers.
  #
  # Empty means no out-of-scope host may refresh.
  allowed-refresh-initiators: []
  #   - example.com
  #   - "*.example.com"

logging:
  level:
    click.yukio.dbsc: INFO
