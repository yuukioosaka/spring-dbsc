# DBSC demo — HTTPS only.
#
# DBSC cannot be tested over plain HTTP. The binding cookie is __Host- prefixed,
# which requires Secure, which requires HTTPS. Over HTTP the browser silently
# drops the cookies and nothing works — with no useful error to explain why.
#
# The keystore referenced below is generated by scripts/make-keystore.sh.

server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: dbsc-demo
  # Tomcat defaults to an 8 KB *aggregate* header limit, which is smaller than the
  # 8192-byte single-header limit DBSC enforces for Sec-Session-Response (the
  # registration JWS). Left at the default, an oversized JWS is rejected by Tomcat
  # with a 400 HTML page before any DBSC filter runs, so the spec's MALFORMED_JWS
  # branch is unreachable. Raise it above 8192 so the protocol layer gets to judge
  # the header; a browser will never legitimately send one this large.
  max-http-request-header-size: 32KB

dbsc:
  # secure: true matches the library default, but it is restated here because it is
  # load-bearing for this profile: __Host- cookies, the Secure flag, and the stricter
  # origin checks, all of which the demo relies on. Any host serving HTTP instead of
  # HTTPS has to set dbsc.secure: false explicitly.
  secure: true
  storage: jdbc
  # The DBSC refresh cadence. Chromium re-runs /dbsc/refresh when the credential
  # cookie is this old, so it is also the window in which a captured cookie is worth
  # something. The library default is 10m; shortened here so a manual session still
  # shows a refresh or two without making Chromium poll hard enough to hit its own
  # per-origin signing quota.
  binding-cookie-ttl: 3m
  # Both scope keys set to something non-empty, so a registration response from the
  # demo shows the real shape rather than two empty arrays. Chromium walks
  # scope_specification in reverse, so "exclude everything under /static" is written
  # first and the narrower "include /api" after it — last match wins.
  scope-specifications:
    - type: exclude
      domain: "*"
      path: /static
    - type: include
      domain: localhost
      path: /api
  # Only these hosts may refresh out of scope. "localhost" matches itself; the
  # wildcard form would be "*.example.com".
  allowed-refresh-initiators:
    - localhost
  # The demo is reached at https://localhost:8443, which the derived origin already
  # gets right — this is here to show the key, and because the demo's whole point is
  # to read the registration response and see what each setting produced.
  scope-origin: https://localhost:8443

spring:
  application:
    name: spring-dbsc-demo
  datasource:
    # File-backed, so registered keys survive a restart. An in-memory store would break
    # every live binding on each reload — the browser keeps its cookie, the
    # server forgets the key, and refresh loops KEY_NOT_FOUND forever.
    url: jdbc:h2:file:./data/demo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  thymeleaf:
    cache: false
    # The demo pages contain plain `<script>` blocks with JS object literals
    # (`{ 'Content-Type': ... }`). Thymeleaf's in-HTML expression parser would
    # try to read those as SpEL and blow up the whole template, so turn it off.
    mode: HTML
    enable-spring-el-compiler: false

logging:
  level:
    click.yukio.dbsc: DEBUG
    org.springframework.security: INFO
