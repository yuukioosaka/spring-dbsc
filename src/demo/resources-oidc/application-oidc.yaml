# OIDC variant of the demo (profile "oidc", on top of "demo").
#
#   ENTRA_TENANT_ID=... ENTRA_CLIENT_ID=... ENTRA_CLIENT_SECRET=... \
#     mvn -Pdemo,oidc -Dmaven.repo.local=.m2repo spring-boot:run
#
# All three come from a single app registration. Nothing here identifies a
# particular directory, so the demo is not tied to one tenant: register an app in
# your own (Entra ID, or any OIDC provider) and point these at it.
#
# Redirect URI to register on the app registration:
#   https://localhost:8443/login/oauth2/code/entraid
# That is Spring Security's callback path, not /oidc — /oidc is only the page the
# browser lands on afterwards, and is where the DBSC binding actually happens.
#
# `entraid` is only a local registration name; it is what appears in that callback
# URL. The provider itself is whatever the issuer resolves to.

demo:
  oidc:
    # Gates DemoOidcConfig and switches the form-login chains off.
    enabled: true

spring:
  security:
    oauth2:
      client:
        registration:
          entraid:
            client-id: ${ENTRA_CLIENT_ID}
            client-secret: ${ENTRA_CLIENT_SECRET}
            # Entra answers a client_secret_basic token request with a 401
            # invalid_token_response; the secret has to go in the body instead.
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          entraid:
            # The /v2.0 form: for Entra the bare tenant URL advertises a different
            # issuer and discovery fails. Another provider takes its own issuer
            # verbatim, e.g. https://accounts.example.com — set ENTRA_ISSUER_URI
            # to override entirely.
            issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0}
            user-name-attribute: sub

logging:
  level:
    # DBSC's own decisions, including the cross-site deferral in bind().
    click.yukio.dbsc: DEBUG
    org.springframework.security: INFO
